# Build the demo/web Svelte toolkit and publish it to GitHub Pages.
# Serves at https://fairflow.github.io/ledgerforge/  (BASE_PATH must match that sub-path).
# Enable once: repo Settings → Pages → Build and deployment → Source: "GitHub Actions".
#
# The engine-exported data (src/lib/data/*.json) and the fictional GnuCash book
# (static/demo.gnucash, XML) are committed, so CI is a plain static build — no Python.
# Regenerate those locally with demo/web/scripts/export_data.py + book_to_xml.py.
name: Deploy demo toolkit to Pages

on:
  push:
    branches: [main]
    paths:
      - 'demo/web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /ledgerforge
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo/web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
